---
variables:
  LANGUAGE_VERSION: python3.9

include:
  - project: nci-gdc/gitlab-templates
    ref: 0.8.0
    file:
      - templates/artifacts/python-library.yaml

tox:
  parallel:
    matrix:
      - LANGUAGE_VERSION:
          - python3.7
          - python3.8
          - python3.9
          - python3.10
          - python3.11
  services:
    - name: docker.osdc.io/ncigdc/ci-postgres-13:${BASE_CONTAINER_VERSION}
      alias: postgres
      variables:
        POSTGRES_PASS: test
        POSTGRES_HOST_AUTH_METHOD: trust
        PG_INIT_SQL: |
          create user test with superuser password 'test';
          create database indexd_test with owner test;
    - name: docker.osdc.io/ncigdc/indexd:develop
      alias: indexd
      pull_policy: always
      entrypoint: [/venv/bin/gunicorn]
      command: [wsgi]
      variables:
        PG_INDEXD_HOST: postgres
        PG_INDEXD_USER: test
        PG_INDEXD_PASS: test
        PG_INDEXD_DBNAME: indexd_test
        INDEXD_USER: admin
        INDEXD_PASS: admin
        GUNICORN_WORKERS: 1
        GUNICORN_THREADS: 1
    - name: docker.osdc.io/ncigdc/ci-postgres-13:${BASE_CONTAINER_VERSION}
      alias: postgres

integrate:
  stage: .post
  allow_failure: true
  extends: .update_pin
  parallel:
    matrix:
      - PY_VER: '3.7'
        REPO_NAME: [gdcadmin, gdcbatch, esbuild, sheepdog]
      - PY_VER: '3.8'
        REPO_NAME: [ancillary-services, bio-client, gdcapi, gdcws]
      - PY_VER: '3.9'
        REPO_NAME: [data-tools, gdc-mutation-indexer, inspector]
  image: docker.osdc.io/ncigdc/python${PY_VER}-builder
