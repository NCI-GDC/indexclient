---
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Python.gitlab-ci.yml
include:
  - project: nci-gdc/gitlab-templates
    ref: master
    file:
      - templates/global/full.yaml

default:
  image: ${BASE_CONTAINER_REGISTRY}/python3.7-builder:${BASE_CONTAINER_VERSION}
  services:
    - name: docker.osdc.io/ncigdc/ci-postgres-13:${BASE_CONTAINER_VERSION}
      alias: postgres
  before_script:
    - !reference [.load_github_key, script]
    - echo "deb http://apt.postgresql.org/pub/repos/apt/ focal-pgdg main 13" | tee /etc/apt/sources.list.d/pgdg.list
    - apt-get update
    - apt-get install -y postgresql-client-13
    - pip install "tox<4"
  tags:
    - dind

variables:
  PG_INDEXD_HOST: postgres

tox:
  stage: test
  variables:
    USE_PYTEST_INDEXD: 'false'
    USE_RUNNING_PG: 'true'
  script:
    - tox -e parallel

test utils2 proc:
  stage: test
  variables:
    USE_PYTEST_INDEXD: 'true'
    USE_RUNNING_PG: 'false'
  script:
    - tox

test utils2 noproc:
  stage: test
  variables:
    USE_PYTEST_INDEXD: 'true'
  script:
    - tox

tox parallel:
  stage: test
  script:
    - tox -e parallel

xdist:
  stage: test
  script:
    - tox -e xdist
