.create_pr:
  before_script:
    - !reference [.load_github_key, script]
    - type -p curl >/dev/null || apt install curl -y
    - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd
      of=/usr/share/keyrings/githubcli-archive-keyring.gpg
    - chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
    - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg]
      https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list
      > /dev/null
    - apt update
    - apt install gh -y
  script:
    - cd $REPO_NAME
    - gh pr create --title $UPDATE_PIN_BRANCH_NAME


