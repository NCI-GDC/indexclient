---
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html

stages:
  - test
  - build
  - update_pins

include:
  - project: nci-gdc/gitlab-templates
    ref: master
    file:
      - templates/global/full.yaml
      - templates/python/full.yaml

default:
  image: ${BASE_CONTAINER_REGISTRY}/python3.7-builder:${BASE_CONTAINER_VERSION}
  services:
    - name: docker.osdc.io/ncigdc/ci-postgres-13:${BASE_CONTAINER_VERSION}
      alias: postgres
  tags:
    - dind

variables:
  PG_INDEXD_HOST: postgres
  UPDATE_PIN_BRANCH_NAME: update-indexcleint-to-$CI_COMMIT_REF_NAME

.prepareTox:
  script:
    - !reference [.load_github_key, script]
    - apt-get update && apt-get install -y gnupg
    - echo "deb http://apt.postgresql.org/pub/repos/apt/ focal-pgdg main 13" | tee
      /etc/apt/sources.list.d/pgdg.list
    - apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 7FCC7D46ACCC4CF8
    - apt-get update
    - apt-get install -y postgresql-client-13
    - pip install "tox<4"

unit_test:
  stage: test
  before_script:
    - !reference [.prepareTox, script]
  script:
    - tox -e unit_test

indexd_test_utils:
  stage: test
  before_script:
    - !reference [.prepareTox, script]
  script:
    - tox -e indexd_test_utils

pytest_indexd_noproc:
  stage: test
  variables:
    USE_PYTEST_INDEXD: 'true'
  before_script:
    - !reference [.prepareTox, script]
  script:
    - tox

pytest_indexd_xdist:
  stage: test
  variables:
    USE_RUNNING_PG: 'true'
  before_script:
    - !reference [.prepareTox, script]
  script:
    - tox -e xdist

tox:
  rules:
    - when: never

docker_build:
  rules:
    - when: never

release:
  rules:
    - when: never

update_pin_for_gdcws:
  stage: update_pins
  image: docker.osdc.io/ncigdc/python36-builder:1.4.0
  script:
    - !reference [.load_github_key, script]
    - git clone git@github.com:NCI-GDC/gdcws.git
    - cd gdcws
    - git checkout "$UPDATE_PIN_BRANCH_NAME" || git checkout -b "$UPDATE_PIN_BRANCH_NAME"
    - git log -1
    - sed -i 's|github.com/NCI-GDC/indexclient.git@.*#egg=indexclient|github.com/NCI-GDC/indexclient.git@'"$CI_COMMIT_REF_NAME"'#egg=indexclient|'
      setup.py
    - cat setup.py
    - sed -i 's|github.com/NCI-GDC/indexclient.git@.*#egg=indexclient|github.com/NCI-GDC/indexclient.git@'"$CI_COMMIT_REF_NAME"'#egg=indexclient|'
      dev-requirements.in
    - cat dev-requirements.in
    - pip3 --version
    - pip3 install virtualenv pip-tools==6.3.0
    - pip-compile -i https://pypi.org/simple
    - pip-compile -i https://pypi.org/simple dev-requirements.in
    - git add .
    - git commit -m "Update pin indexclient $CI_COMMIT_REF_NAME $CI_COMMIT_SHA"
    - git push origin "$UPDATE_PIN_BRANCH_NAME"
  rules:
    - if: $CI_COMMIT_TAG != null
    - if: $CI_COMMIT_TAG == null
#       when: manual
  allow_failure: true


update_pin_for_sheepdog:
  stage: update_pins
  image: docker.osdc.io/ncigdc/python3.7-builder:2.2.0
  variables:
    REPO_NAME: sheepdog
  script:
    - !reference [.load_github_key, script]
    - git clone git@github.com:NCI-GDC/"$REPO_NAME".git
    - cd "$REPO_NAME"
    - git checkout "$UPDATE_PIN_BRANCH_NAME" || git checkout -b "$UPDATE_PIN_BRANCH_NAME"
    - git log -1
    - sed -i 's|github.com/NCI-GDC/indexclient.git@.*#egg=indexclient|github.com/NCI-GDC/indexclient.git@'"$CI_COMMIT_REF_NAME"'#egg=indexclient|'
      setup.py
    - cat setup.py
    - sed -i 's|github.com/NCI-GDC/indexclient.git@.*#egg=indexclient|github.com/NCI-GDC/indexclient.git@'"$CI_COMMIT_REF_NAME"'#egg=indexclient|'
      dev-requirements.in
    - cat dev-requirements.in
    - pip3 --version
    - pip3 install virtualenv pip-tools==6.3.0
    - pip-compile -i https://pypi.org/simple
    - pip-compile -i https://pypi.org/simple dev-requirements.in
    - git add .
    - git commit -m "Update pin indexclient $CI_COMMIT_REF_NAME $CI_COMMIT_SHA"
    - git push origin "$UPDATE_PIN_BRANCH_NAME"
  rules:
    - if: $CI_COMMIT_TAG != null
    - if: $CI_COMMIT_TAG == null
#       when: manual
  allow_failure: true
