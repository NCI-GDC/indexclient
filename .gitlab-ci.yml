---
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html

stages:
  - test
  - build
  - update_pins
  - create_pr

include:
  - project: nci-gdc/gitlab-templates
    ref: master
    file:
      - templates/global/full.yaml
      - templates/python/full.yaml

default:
  image: ${BASE_CONTAINER_REGISTRY}/python3.7-builder:${BASE_CONTAINER_VERSION}
  services:
    - name: docker.osdc.io/ncigdc/ci-postgres-13:${BASE_CONTAINER_VERSION}
      alias: postgres
  tags:
    - dind

variables:
  PG_INDEXD_HOST: postgres

.prepareTox:
  script:
    - !reference [.load_github_key, script]
    - apt-get update && apt-get install -y gnupg
    - echo "deb http://apt.postgresql.org/pub/repos/apt/ focal-pgdg main 13" | tee
      /etc/apt/sources.list.d/pgdg.list
    - apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 7FCC7D46ACCC4CF8
    - apt-get update
    - apt-get install -y postgresql-client-13
    - pip install "tox<4"
  needs: [pre-commit]

unit_test:
  stage: test
  before_script:
    - !reference [.prepareTox, script]
  needs:
    - !reference [.prepareTox, needs]
  script:
    - tox -e unit_test

indexd_test_utils:
  stage: test
  before_script:
    - !reference [.prepareTox, script]
  needs:
    - !reference [.prepareTox, needs]
  script:
    - tox -e indexd_test_utils

pytest_indexd_noproc:
  stage: test
  variables:
    USE_PYTEST_INDEXD: 'true'
  before_script:
    - !reference [.prepareTox, script]
  needs:
    - !reference [.prepareTox, needs]
  script:
    - tox

pytest_indexd_xdist:
  stage: test
  variables:
    USE_RUNNING_PG: 'true'
  before_script:
    - !reference [.prepareTox, script]
  needs:
    - !reference [.prepareTox, needs]
  script:
    - tox -e xdist

tox:
  rules:
    - when: never

docker_build:
  rules:
    - when: never

release:
  rules:
    - when: never

.update_pin:
  before_script:
    - !reference [.load_github_key, script]
    - git clone git@github.com:NCI-GDC/"$REPO_NAME".git
    - cd "$REPO_NAME"
    - git checkout "$UPDATE_PIN_BRANCH_NAME" || git checkout -b "$UPDATE_PIN_BRANCH_NAME"
    - git log -1
    - sed -i 's|github.com/NCI-GDC/indexclient.git@.*#egg=indexclient|github.com/NCI-GDC/indexclient.git@'"$INDEXCLIENT_TARGET_VERSION"'#egg=indexclient|'
      setup.py || true
    - cat setup.py || true
    - sed -i 's|github.com/NCI-GDC/indexclient.git@.*#egg=indexclient|github.com/NCI-GDC/indexclient.git@'"$INDEXCLIENT_TARGET_VERSION"'#egg=indexclient|'
      dev-requirements.in || true
    - cat dev-requirements.in || true
    - pip3 install 'pip<22'     # error importing BAR_TYPES, assert assert isinstance(handler, logging.StreamHandler)
    - pip3 install virtualenv pip-tools==6.3.0 "setuptools_scm<6"

  script:
    - pwd
    - pip-compile -i https://pypi.org/simple
    - pip-compile -i https://pypi.org/simple dev-requirements.in

  after_script:
    - !reference [.load_github_key, script]
    - cd "$REPO_NAME"
    - pwd
    - git add .
    - git commit -m "Update indexclient to $INDEXCLIENT_TARGET_VERSION $CI_COMMIT_SHA"
    - git push origin "$UPDATE_PIN_BRANCH_NAME"
  needs:
    - pytest_indexd_noproc
    - pytest_indexd_xdist
    - indexd_test_utils
    - unit_test
  rules:
    - if: $INDEXCLIENT_TARGET_VERSION_OVERRIDE != null
      variables:
        INDEXCLIENT_TARGET_VERSION: $INDEXCLIENT_TARGET_VERSION_OVERRIDE
        UPDATE_PIN_BRANCH_NAME: auto/update-indexcleint-to-$INDEXCLIENT_TARGET_VERSION
    - when: always
      variables:
        INDEXCLIENT_TARGET_VERSION: $CI_COMMIT_REF_NAME
        UPDATE_PIN_BRANCH_NAME: auto/update-indexcleint-to-$INDEXCLIENT_TARGET_VERSION


