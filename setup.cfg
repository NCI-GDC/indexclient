[metadata]
name = indexclient
description = IndexD python API client
long_description = file: README.md
long_description_content_type = text/markdown
author = Gdc feature team
author_email = gdc_dev_questions-aaaaae2lhsbell56tlvh3upgoq@cdis.slack.com
maintainer = GDC Feature Team
maintainer_email = gdc_dev_questions-aaaaae2lhsbell56tlvh3upgoq@cdis.slack.com
license = Apache Software License 2.0
license_files = LICENSE
url = https://github.com/NCI-GDC/indexclient
keywords = Genomic Data Commons, IndexD, REST, indexclient
classifiers =
    License :: OSI Approved :: Apache Software License
    Topic :: Software Development :: Libraries :: Python Modules
    Programming Language :: Python
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13

[options]
zip_safe = True
packages = find:
package_dir =
    =src
python_requires = >=3.10
include_package_data = True
install_requires =
    requests

[options.packages.find]
where = src

[options.extras_require]
dev =
    coverage[toml]
    indexd
    pytest>=6
    pytest-cov
    sqlalchemy
    sqlalchemy-utils

pytest_indexd =
    deepdiff
    importlib_resources
    psycopg
    pytest
    pytest-cov[toml]
    pytest-postgresql
    pytest-xdist
    pyyaml
    indexd
    indexdmodels

types =
    types-requests
