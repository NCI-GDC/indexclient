[tox]
envlist= py38,py39,p310,py311
skip_missing_interpreters = True
isolated_build = True

[testenv]
passenv =
    PG_INDEXD_HOST
setenv =
    NO_PROXY=localhost,postgres
    no_proxy=localhost,postgres
    USE_PYTEST_INDEXD=true
extras=
    dev
install_command = python -m pip install {opts} {packages}
commands=
    python -m pytest -lv --cov-report xml --cov-report html --junit-xml report.xml {posargs}

[testenv:fixtures]
passenv =
    PG_*
setenv =
    NO_PROXY=localhost,postgres
    no_proxy=localhost,postgres
    USE_PYTEST_INDEXD=false
extras=
    dev
install_command = python -m pip install {opts} {packages}
commands=
    python -m pytest {posargs: -lvvvs tests/integration/test_client.py}

[testenv:plugin]
passenv =
    PG_*
    USE_*
setenv =
    USE_RUNNING_PG=true
    USE_PYTEST_INDEXD=true
    NO_PROXY=localhost,postgres
    no_proxy=localhost,postgres
;    MacOS requires the following environment variable to run test in parallel
    OBJC_DISABLE_INITIALIZE_FORK_SAFETY = YES

extras=
    pytest_indexd

install_command = python -m pip install {opts} {packages}

commands=
    # Limit the number of processes to avoid postgres too many clients already
    python -m pytest {posargs: -lvvvs tests/integration}

[testenv:lint]
basepython = python3.8
skip_install = True
commands_pre =
deps =
    pre-commit
commands =
    pre-commit run --all-files --show-diff-on-failure {posargs: }

[testenv:publish]
passenv =
  TWINE_*
skip_install=true
deps =
    setuptools_scm
    build
    twine
install_command =
    python -m pip install {opts} {packages}
commands =
    python -m setuptools_scm
    python -m build
    python -m twine check dist/*
    python -m twine upload dist/*
commands_post=
