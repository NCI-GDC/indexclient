[build-system]
requires = ["setuptools<81.0.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "coverage[toml]",
  "indexd",
  "pytest>=6",
  "pytest-cov",
  "setuptools<81.0.0",
  "sqlalchemy",
  "sqlalchemy-utils"
]

[project]
name = "indexclient"
description = "IndexD python API client"
readme = "README.md"
requires-python = ">=3.7"
license-files = ["LICENSE"]
authors = [
  {name = "GDC Feature Team", email = "gdc_dev_questions-aaaaae2lhsbell56tlvh3upgoq@cdis.slack.com"}
]
maintainers = [
  {name = "GDC Feature Team", email = "gdc_dev_questions-aaaaae2lhsbell56tlvh3upgoq@cdis.slack.com"}
]
keywords = ["Genomic Data Commons", "IndexD", "REST", "indexclient"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = ["requests"]
dynamic = ["version"]

[project.optional-dependencies]
pytest-indexd = [
  "deepdiff",
  "importlib-resources",
  "psycopg",
  "pytest",
  "pytest-cov",
  "pytest-postgresql",
  "pytest-xdist",
  "pyyaml",
  "indexd",
  "indexdmodels",
  "setuptools<81.0.0"
]

[project.urls]
Repository = "https://github.com/NCI-GDC/indexclient"

[tool.black]
include = '\.pyi?$'
line-length = 98

[tool.coverage.html]
title = "indexclient coverage report"
directory = "docs/htmlcov"
show_contexts = true

[tool.coverage.run]
branch = true
context = "unit tests"
source = ["indexclient"]

[tool.isort]
profile = "black"
known_first_party = ["indexclient"]

[tool.pytest.ini_options]
minversion = 6.0
# Silence warning by opting in to use pytest 6's new default value
junit_family = "xunit2"
junit_logging = "system-out"
console_output_style = "classic"
log_cli_level = "INFO"
log_cli = "true"
addopts = "-rfE --color=yes --maxfail=10 --cov=indexclient --cov-report term"
norecursedirs = [".git", ".tox", "dist", "build"]
testpaths = ["tests/unit"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.tox]
env_list = ["python3.7", "python3.8", "python3.9", "python3.10", "python3.11"]

[tool.tox.env_base.fixtures]
factors = [["python3.7", "python3.8", "python3.9", "python3.10", "python3.11"]]
pass_env = ["PG_*"]
commands = [
  [
    "pytest",
    {replace = "posargs", default = [
      "-lvvvs",
      "tests/integration/test_client.py"
    ], extend = true}
  ]
]

[tool.tox.env_base.fixtures.set_env]
NO_PROXY = "localhost,postgres"
no_proxy = "localhost,postgres"
USE_PYTEST_INDEXD = "false"

[tool.tox.env_base.plugin]
factors = [["python3.7", "python3.8", "python3.9", "python3.10", "python3.11"]]
pass_env = ["PG_*", "USE_*"]
dependency_groups = []
extras = ["pytest-indexd"]
commands = [
  [
    "pytest",
    {replace = "posargs", default = ["-lvvvs", "tests/integration"], extend = true}
  ]
]

[tool.tox.env_base.plugin.set_env]
USE_RUNNING_PG = "true"
USE_PYTEST_INDEXD = "true"
NO_PROXY = "localhost,postgres"
no_proxy = "localhost,postgres"
# MacOS requires the following environment variable to run test in parallel
OBJC_DISABLE_INITIALIZE_FORK_SAFETY = "YES"

[tool.tox.env_base.test]
factors = [["python3.7", "python3.8", "python3.9", "python3.10", "python3.11"]]

[tool.tox.env_run_base]
base_python = "{factor:0}"
pass_env = ["PG_INDEXD_HOST"]
dependency_groups = ["dev"]
commands = [
  [
    "pytest",
    "-lv",
    {replace = "posargs", default = [
      "--cov-report=xml",
      "--cov-report=html",
      "--junit-xml=report.xml"
    ], extend = true}
  ]
]
ignore_base_python_conflict = true

[tool.tox.env_run_base.set_env]
NO_PROXY = "localhost,postgres"
no_proxy = "localhost,postgres"
USE_PYTEST_INDEXD = "true"
